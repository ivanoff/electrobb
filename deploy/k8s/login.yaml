apiVersion: v1
kind: Pod
metadata:
  name: electrobb-login
spec:
  restartPolicy: Never
  imagePullSecrets:
    - name: electrobb-registry
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  initContainers:
    - name: prepare-data
      image: docker.virt.biz/electrobb:latest
      imagePullPolicy: Always
      command: ["/bin/sh", "-ec"]
      args: ["mkdir -p /data/cache /data/logs; chmod 700 /data/cache /data/logs"]
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      volumeMounts:
        - name: data
          mountPath: /data
  containers:
    - name: electrobb
      stdin: true
      tty: true
      args: ["--login", "--qr"]
      image: docker.virt.biz/electrobb:latest
      imagePullPolicy: Always
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: "1"
          memory: 512Mi
      volumeMounts:
        - name: config
          mountPath: /app/.env
          subPath: .env
          readOnly: true
        - name: data
          mountPath: /app/cache
          subPath: cache
        - name: data
          mountPath: /app/logs
          subPath: logs
  volumes:
    - name: config
      secret:
        secretName: electrobb-env
    - name: data
      persistentVolumeClaim:
        claimName: electrobb-data
